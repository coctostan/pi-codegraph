name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly: catch pi host drift early

jobs:
  ci:
    name: Test & Type-check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "*"] # "*" is the newest stable; "current" takes Node's index head, a v27 alpha on 2026-11-02

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4" # the version that writes bun.lock; pi-latest stays on latest

      - name: Install build tools
        run: sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clone pi-hashline-readmap for the sibling hashline case
        run: |
          git clone --depth 1 https://github.com/coctostan/pi-hashline-readmap ../pi-hashline-readmap
          cd ../pi-hashline-readmap && npm ci --omit=dev --omit=peer --omit=optional --ignore-scripts

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun test

  required:
    name: Test & Type-check # required status check name; do not rename
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Node leg passed
        run: test "${{ needs.ci.result }}" = success

  pi-latest:
    name: Compatibility (latest pi host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install build tools
        run: sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Upgrade to the latest pi host
        run: npm install --no-save --legacy-peer-deps @earendil-works/pi-coding-agent@latest

      - name: Report host version
        run: node -p "JSON.parse(require('fs').readFileSync('node_modules/@earendil-works/pi-coding-agent/package.json','utf8')).version"

      - name: Type-check against latest host declarations
        run: bun run check

      - name: Load through the latest host's real loader
        run: bun test test/pi-host-load.test.ts test/extension-host-contract.test.ts
